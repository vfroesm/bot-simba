<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Virtual Gigante - Distrito 4521</title>
    
    <!-- Fonte Oficial Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Simulação do site de fundo -->
    <div class="site-simulado">
        <h1>Distrito 4521</h1>
        <p>Área de validação do assistente virtual distrital.</p>
    </div>

    <!-- Ícone Flutuante (Botão do Leão) -->
    <div id="chat-icon">🦁</div>

    <!-- Caixa do Chat -->
    <div id="chat-container" style="display: none;">
        
        <!-- Cabeçalho -->
        <div class="chat-header">
            <div class="chat-header-info">
                <span class="chat-avatar">🦁</span>
                <div>
                    <h3 class="chat-title">Assistente Gigante</h3>
                    <span class="chat-subtitle">Distrito 4521</span>
                </div>
            </div>
            <button id="close-chat">&times;</button>
        </div>

        <!-- Histórico de Mensagens e Botões -->
        <div id="chat-messages"></div>

        <!-- Campo de Input Rodapé -->
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Digite sua dúvida ou clique em um atalho..." autocomplete="off">
            <button id="send-btn">Enviar</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
